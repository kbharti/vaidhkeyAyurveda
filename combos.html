<!-- combos.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Combos</title>
    <script>
        // JavaScript logic for Add to Cart functionality
        function addToCart(productId, productName, productPrice) {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];

            // Check if product already exists in the cart
            let existingProduct = cart.find(product => product.id === productId);
            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push({ id: productId, name: productName, price: productPrice, quantity: 1 });
            }

            localStorage.setItem('cart', JSON.stringify(cart));
            updateCartCount();
        }

        function updateCartCount() {
            let cart = JSON.parse(localStorage.getItem('cart')) || [];
            document.getElementById('cart-count').innerText = cart.reduce((total, product) => total + product.quantity, 0);
        }

        // Initialize cart count on page load
        window.onload = updateCartCount;
    </script>
</head>
<body>
    <h1>Our Combos</h1>
    <span>Cart Items: <span id="cart-count">0</span></span>
    <div>
        <h2>Combo 1</h2>
        <p>Price: $20</p>
        <button onclick="addToCart('combo1', 'Combo 1', 20)">Add to Cart</button>
    </div>
    <div>
        <h2>Combo 2</h2>
        <p>Price: $30</p>
        <button onclick="addToCart('combo2', 'Combo 2', 30)">Add to Cart</button>
    </div>
</body>
</html>
